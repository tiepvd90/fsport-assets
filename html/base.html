<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fun-Sport</title>

  <!-- ✅ CSS -->
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/stickyfooter.css">
  <link rel="stylesheet" href="/css/cartpopup.css?v=20260714-cart-scrollbar-1">
  <link rel="stylesheet" href="/css/voucherpopup.css">
  <link rel="stylesheet" href="/css/checkoutpopup.css">

  <!-- ✅ Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />

  <script src="/js/tracking-consent.js?v=20260904-atc-unblocked-1"></script>
  <script src="/js/tracking.js?v=20260904-atc-reliable-1"></script>
</head>

<body>

  <!-- ✅ JS -->
  <script src="/js/base.js"></script>
  <script src="/js/stickyfooter.js"></script>
  <script src="/js/cartpopup.js?v=20260904-sticky-footer-source-3"></script>
  <script src="/js/checkoutpopup.js"></script>
  <script src="/js/voucherpopup.js"></script>
  <script src="/js/collectionIcon.js?v=2" defer></script>
  <script>console.log("✅ Base.html scripts loaded");</script>

  <!-- ✅ Biến toàn cục -->
  <script>
    // 💸 Giá trị voucher toàn cục
    window.currentVoucherValue = 0;

    // 🚚 Tải bảng phí vận chuyển
    fetch("/json/shippingfee.json")
      .then(res => res.json())
      .then(data => window.shippingFeeMap = data)
      .catch(err => console.warn("Không thể load shippingfee.json", err));

    // ⚙️ Tải config hệ thống
    fetch("/json/settings.json")
      .then(res => res.json())
      .then(data => window.globalSettings = data)
      .catch(err => console.warn("Không thể tải settings.json", err));
  </script>

</body>
</html>
